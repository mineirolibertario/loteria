<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apurador Lotofácil - Modalidade Erre-X</title>
    <!-- Tailwind CSS para Estilização -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js para Reatividade -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Canvas Confetti para Animação de Fireworks -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 p-3 md:p-6 font-sans">

    <!-- Container Otimizado para Full HD (max-w-7xl) -->
    <div class="max-w-7xl mx-auto" x-data="apuradorErreX()">

        <!-- Cabeçalho Compacto -->
        <header class="mb-4 text-center">
            <h1 class="text-2xl md:text-3xl font-extrabold text-emerald-400 tracking-wider">APURADOR LOTOFÁCIL</h1>
            <p class="text-xs md:text-sm text-slate-400">Modalidade Erre-X (Premia apenas ao errar 100% do palpite)</p>
        </header>

        <!-- Área de Entrada de Dados -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">

            <!-- Caixa de Sorteios -->
            <div class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
                <label class="block text-xs font-semibold mb-1 text-emerald-300">
                    1. Sorteios (Formato: Concurso Data D1 D2...)
                </label>
                <textarea x-model="inputSorteios" rows="5"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 font-mono resize-none"
                    placeholder="3770 24/08/2026 01 02 04 07 08 12 13 15 16 17 18 19 23 24 25"></textarea>
                <span class="text-[10px] text-slate-500 mt-1 block">Cole um sorteio por linha.</span>
            </div>

            <!-- Caixa de Palpites -->
            <div class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
                <label class="block text-xs font-semibold mb-1 text-emerald-300">
                    2. Seus Palpites (2 a 10 dezenas por linha)
                </label>
                <textarea x-model="inputPalpites" rows="5"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 font-mono resize-none"
                    placeholder="03 05 06 09 10&#10;11 14 20 21 22"></textarea>
                <span class="text-[10px] text-slate-500 mt-1 block">Cole um palpite por linha (de 2 a 10 dezenas).</span>
            </div>

        </div>

        <!-- Botão de Ação -->
        <div class="text-center mb-6">
            <button @click="processarApuracao()"
                class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-8 py-2.5 rounded-xl shadow-lg transition transform hover:-translate-y-0.5 text-sm">
                Apurar Erre-X
            </button>
        </div>

        <!-- Resultados -->
        <template x-if="processado">
            <div class="space-y-4">

                <!-- RESUMO FINANCEIRO (NOVA FEATURE) -->
                <section class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
                    <h2 class="text-sm font-bold mb-3 text-emerald-400 border-b border-slate-700 pb-1.5 uppercase tracking-wide">Resumo Financeiro</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-center">
                        <div class="bg-slate-900 p-3 rounded-lg border border-slate-700">
                            <span class="block text-slate-400 text-[10px] uppercase font-semibold">Custo Total (R$ 1,00/jogo)</span>
                            <span class="text-xl font-bold text-rose-400" x-text="formatarMoeda(financeiro.custoTotal)"></span>
                        </div>
                        <div class="bg-slate-900 p-3 rounded-lg border border-slate-700">
                            <span class="block text-slate-400 text-[10px] uppercase font-semibold">Premiação Total</span>
                            <span class="text-xl font-bold text-emerald-400" x-text="formatarMoeda(financeiro.premiacaoTotal)"></span>
                        </div>
                        <div class="bg-slate-900 p-3 rounded-lg border border-slate-700">
                            <span class="block text-slate-400 text-[10px] uppercase font-semibold">Resultado Líquido</span>
                            <span class="text-2xl font-black"
                                  :class="financeiro.liquido >= 0 ? 'text-emerald-400' : 'text-rose-500'"
                                  x-text="formatarMoeda(financeiro.liquido)"></span>
                        </div>
                    </div>
                </section>

                <!-- PAINEL SUPERIOR: RESUMO GERAL + METRICAS -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">

                    <!-- RESUMO GERAL -->
                    <section class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
                        <h2 class="text-sm font-bold mb-3 text-emerald-400 border-b border-slate-700 pb-1.5 uppercase tracking-wide">Resumo Geral</h2>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center">
                            <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-700">
                                <span class="block text-slate-400 text-[10px] uppercase font-semibold">Total Sorteios</span>
                                <span class="text-xl font-bold text-slate-100" x-text="resumo.totalSorteios"></span>
                            </div>
                            <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-700">
                                <span class="block text-slate-400 text-[10px] uppercase font-semibold">Total Palpites</span>
                                <span class="text-xl font-bold text-slate-100" x-text="resumo.totalPalpites"></span>
                            </div>
                            <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-700">
                                <span class="block text-slate-400 text-[10px] uppercase font-semibold">Erros (Prêmios)</span>
                                <span class="text-xl font-bold text-emerald-400" x-text="resumo.totalAcantosErros"></span>
                            </div>
                            <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-700">
                                <span class="block text-slate-400 text-[10px] uppercase font-semibold">Aproveitamento</span>
                                <span class="text-xl font-bold text-amber-400" x-text="resumo.taxaSucesso + '%'"></span>
                            </div>
                        </div>
                    </section>

                    <!-- ESTATÍSTICAS DOS CONCURSOS -->
                    <section class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
                        <h2 class="text-sm font-bold mb-3 text-emerald-400 border-b border-slate-700 pb-1.5 uppercase tracking-wide">Estatísticas por Concurso</h2>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center font-mono">
                            <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-700">
                                <span class="block text-slate-400 text-[10px] uppercase font-semibold font-sans">Mínimo</span>
                                <span class="text-xl font-bold text-slate-100" x-text="metricasConcursos.min"></span>
                            </div>
                            <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-700">
                                <span class="block text-slate-400 text-[10px] uppercase font-semibold font-sans">Máximo</span>
                                <span class="text-xl font-bold text-emerald-400" x-text="metricasConcursos.max"></span>
                            </div>
                            <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-700">
                                <span class="block text-slate-400 text-[10px] uppercase font-semibold font-sans">Média</span>
                                <span class="text-xl font-bold text-cyan-400" x-text="metricasConcursos.avg"></span>
                            </div>
                            <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-700">
                                <span class="block text-slate-400 text-[10px] uppercase font-semibold font-sans">Cobertura</span>
                                <span class="text-xl font-bold text-indigo-400" x-text="metricasConcursos.ratio + '%'"></span>
                            </div>
                        </div>
                    </section>
                </div>

                <!-- CONCURSOS SEM PREMIAÇÕES -->
                <section class="bg-slate-800 p-3.5 rounded-xl shadow-lg border border-slate-700">
                    <h2 class="text-xs font-bold mb-2 text-emerald-400 uppercase tracking-wide">Concursos sem Premiação</h2>
                    <template x-if="concursosSemPremio.length === 0">
                        <div class="p-2 bg-emerald-500/10 border border-emerald-500/30 rounded-lg text-emerald-400 font-semibold text-xs text-center">
                            🎉 Todos os concursos registrados obtiveram ao menos uma premiação!
                        </div>
                    </template>
                    <template x-if="concursosSemPremio.length > 0">
                        <div class="p-2.5 bg-rose-500/10 border border-rose-500/30 rounded-lg text-rose-300 text-xs">
                            <span class="font-bold inline-mr-2">Concursos sem prêmio:</span>
                            <span class="font-mono text-xs" x-text="concursosSemPremio.join(', ')"></span>
                        </div>
                    </template>
                </section>

                <!-- PAINEL INTERMEDIÁRIO: PREMIADOS POR CONCURSO (REDUZIDO) + RANKING -->
                <div class="grid grid-cols-1 xl:grid-cols-3 gap-4">

                    <!-- PREMIADOS POR CONCURSO (FORMATO REDUZIDO Ex: #3770: 2x) -->
                    <section class="xl:col-span-2 bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
                        <h2 class="text-sm font-bold mb-3 text-emerald-400 border-b border-slate-700 pb-1.5 uppercase tracking-wide">Premiados por Concurso</h2>
                        <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 xl:grid-cols-8 gap-2 font-mono max-h-56 overflow-y-auto pr-1">
                            <template x-for="c in resumoPorConcurso" :key="c.concurso">
                                <div class="bg-slate-900 p-2 rounded-lg border border-slate-700 text-center flex items-center justify-between px-2.5">
                                    <span class="text-[11px] text-slate-400" x-text="'#' + c.concurso"></span>
                                    <span class="text-xs font-bold"
                                          :class="c.premiados > 0 ? 'text-emerald-400' : 'text-slate-500'"
                                          x-text="c.premiados + 'x'"></span>
                                </div>
                            </template>
                        </div>
                    </section>

                    <!-- RANKING DOS PALPITES -->
                    <section class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
                        <h2 class="text-sm font-bold mb-3 text-emerald-400 border-b border-slate-700 pb-1.5 uppercase tracking-wide">Ranking dos Palpites</h2>
                        <div class="overflow-y-auto max-h-56 pr-1">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="bg-slate-900 text-slate-400 uppercase text-[10px]">
                                        <th class="p-2 border-b border-slate-700 text-center">#</th>
                                        <th class="p-2 border-b border-slate-700">ID</th>
                                        <th class="p-2 border-b border-slate-700">Dezenas</th>
                                        <th class="p-2 border-b border-slate-700 text-center">Total</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-700 font-mono">
                                    <template x-for="(p, index) in rankingPalpites" :key="p.id">
                                        <tr class="hover:bg-slate-750 transition">
                                            <td class="p-1.5 text-center font-bold text-amber-400" x-text="(index + 1) + 'º'"></td>
                                            <td class="p-1.5 text-slate-300" x-text="'#' + p.id"></td>
                                            <td class="p-1.5 text-slate-300 text-[11px]" x-text="p.dezenasStr"></td>
                                            <td class="p-1.5 text-center font-bold text-emerald-400" x-text="p.premiacoes + 'x'"></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </section>

                </div>

                <!-- DETALHAMENTO COMPLETO -->
                <section class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-700 pb-2 mb-3 gap-2">
                        <h2 class="text-sm font-bold text-emerald-400 uppercase tracking-wide">Detalhamento Completo</h2>

                        <!-- CHECKBOX FILTRO -->
                        <label class="inline-flex items-center cursor-pointer select-none">
                            <input type="checkbox" x-model="apenasPremiados" class="sr-only peer">
                            <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500 relative"></div>
                            <span class="ml-2.5 text-xs font-medium text-slate-300">Exibir apenas premiados</span>
                        </label>
                    </div>

                    <div class="overflow-y-auto max-h-80">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead class="sticky top-0 bg-slate-900 shadow">
                                <tr class="text-slate-400 uppercase text-[10px]">
                                    <th class="p-2 border-b border-slate-700">Concurso</th>
                                    <th class="p-2 border-b border-slate-700">Data</th>
                                    <th class="p-2 border-b border-slate-700">ID Palpite</th>
                                    <th class="p-2 border-b border-slate-700">Dezenas Apostadas</th>
                                    <th class="p-2 border-b border-slate-700 text-center">Status Erre-X</th>
                                    <th class="p-2 border-b border-slate-700 text-right">Prêmio (R$)</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-700 font-mono">
                                <template x-for="item in detalhadoFiltrado" :key="item.id">
                                    <tr class="hover:bg-slate-750 transition">
                                        <td class="p-2 font-bold text-emerald-300" x-text="item.concurso"></td>
                                        <td class="p-2 text-slate-400" x-text="item.data"></td>
                                        <td class="p-2 text-slate-400" x-text="'#' + item.palpiteIndex"></td>
                                        <td class="p-2 text-slate-300" x-text="item.palpiteStr"></td>
                                        <td class="p-2 text-center">
                                            <span class="px-2 py-0.5 rounded text-[10px] font-bold"
                                                :class="item.acertos === 0 ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/20 text-rose-400 border border-rose-500/30'"
                                                x-text="item.acertos === 0 ? '🏆 PREMIADO' : 'NÃO PREMIADO'">
                                            </span>
                                        </td>
                                        <td class="p-2 text-right font-bold"
                                            :class="item.premioVal > 0 ? 'text-emerald-400' : 'text-slate-500'"
                                            x-text="formatarMoeda(item.premioVal)">
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </section>

            </div>
        </template>

    </div>

    <!-- Script de Lógica -->
    <script>
        function apuradorErreX() {
            return {
                inputSorteios: '',
                inputPalpites: '',
                processado: false,
                apenasPremiados: true,
                // Tabela de Premiações
                tabelaPremios: {
                    4: 41.00,
                    5: 146.00,
                    6: 560.00,
                    7: 1801.00
                },
                resumo: {
                    totalSorteios: 0,
                    totalPalpites: 0,
                    totalAcantosErros: 0,
                    taxaSucesso: 0
                },
                financeiro: {
                    custoTotal: 0,
                    premiacaoTotal: 0,
                    liquido: 0
                },
                metricasConcursos: {
                    min: 0,
                    max: 0,
                    avg: 0,
                    ratio: 0
                },
                resumoPorConcurso: [],
                concursosSemPremio: [],
                rankingPalpites: [],
                detalhado: [],

                get detalhadoFiltrado() {
                    if (this.apenasPremiados) {
                        return this.detalhado.filter(item => item.acertos === 0);
                    }
                    return this.detalhado;
                },

                formatarMoeda(valor) {
                    return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                },

                dispararFireworks() {
                    const duration = 3 * 1000;
                    const end = Date.now() + duration;

                    (function frame() {
                        confetti({
                            particleCount: 5,
                            angle: 60,
                            spread: 55,
                            origin: { x: 0 }
                        });
                        confetti({
                            particleCount: 5,
                            angle: 120,
                            spread: 55,
                            origin: { x: 1 }
                        });

                        if (Date.now() < end) {
                            requestAnimationFrame(frame);
                        }
                    })();
                },

                processarApuracao() {
                    const linhasSorteios = this.inputSorteios.trim().split('\n').filter(l => l.trim() !== '');
                    const sorteiosParsed = linhasSorteios.map(linha => {
                        const partes = linha.trim().split(/\s+/);
                        return {
                            concurso: partes[0],
                            data: partes[1],
                            dezenas: partes.slice(2)
                        };
                    });

                    const linhasPalpites = this.inputPalpites.trim().split('\n').filter(l => l.trim() !== '');
                    const palpitesParsed = linhasPalpites.map((linha, idx) => {
                        const dezenas = linha.trim().split(/\s+/);
                        return { id: idx + 1, dezenas: dezenas };
                    }).filter(p => p.dezenas.length >= 2 && p.dezenas.length <= 10);

                    let detalhesTemp = [];
                    let totalErrosGerais = 0;
                    let totalComparacoes = 0;
                    let contagemPorConcurso = {};
                    let contagemPorPalpite = {};
                    let premiacaoTotalAcumulada = 0;

                    palpitesParsed.forEach(p => {
                        contagemPorPalpite[p.id] = {
                            id: p.id,
                            dezenasStr: p.dezenas.join(' '),
                            premiacoes: 0
                        };
                    });

                    sorteiosParsed.forEach(sorteio => {
                        contagemPorConcurso[sorteio.concurso] = 0;

                        palpitesParsed.forEach(palpite => {
                            totalComparacoes++;
                            let acertos = 0;
                            palpite.dezenas.forEach(num => {
                                if (sorteio.dezenas.includes(num)) {
                                    acertos++;
                                }
                            });
                            let erros = palpite.dezenas.length - acertos;
                            let acertouTudo = (acertos === 0);
                            let valorPremio = 0;

                            if (acertouTudo) {
                                totalErrosGerais++;
                                contagemPorConcurso[sorteio.concurso]++;
                                contagemPorPalpite[palpite.id].premiacoes++;

                                // Cálculo da Premiação
                                const qtdDezenas = palpite.dezenas.length;
                                valorPremio = this.tabelaPremios[qtdDezenas] || 0;
                                premiacaoTotalAcumulada += valorPremio;
                            }

                            detalhesTemp.push({
                                id: `${sorteio.concurso}-${palpite.id}`,
                                concurso: sorteio.concurso,
                                data: sorteio.data,
                                palpiteIndex: palpite.id,
                                palpiteStr: palpite.dezenas.join(' '),
                                acertos: acertos,
                                erros: erros,
                                premioVal: valorPremio
                            });
                        });
                    });

                    // Cálculo Financeiro (Custo R$ 1,00 por palpite por concurso)
                    const custoTotal = totalComparacoes * 1.00;
                    const liquido = premiacaoTotalAcumulada - custoTotal;

                    this.financeiro = {
                        custoTotal: custoTotal,
                        premiacaoTotal: premiacaoTotalAcumulada,
                        liquido: liquido
                    };

                    // Lista de Concursos e Premiações
                    this.resumoPorConcurso = Object.keys(contagemPorConcurso).map(conc => ({
                        concurso: conc,
                        premiados: contagemPorConcurso[conc]
                    }));

                    // Concursos Sem Premiação
                    this.concursosSemPremio = this.resumoPorConcurso
                        .filter(c => c.premiados === 0)
                        .map(c => c.concurso);

                    // Métricas: Min, Max, Avg, Ratio
                    const qtdsPremiados = this.resumoPorConcurso.map(c => c.premiados);
                    const totalConcursos = sorteiosParsed.length;
                    const concursosComPremio = qtdsPremiados.filter(q => q > 0).length;

                    if (totalConcursos > 0) {
                        const min = Math.min(...qtdsPremiados);
                        const max = Math.max(...qtdsPremiados);
                        const sum = qtdsPremiados.reduce((a, b) => a + b, 0);
                        const avg = (sum / totalConcursos).toFixed(2);
                        const ratio = ((concursosComPremio / totalConcursos) * 100).toFixed(2);

                        this.metricasConcursos = { min, max, avg, ratio };
                    }

                    // Ranking dos Palpites
                    this.rankingPalpites = Object.values(contagemPorPalpite)
                        .sort((a, b) => b.premiacoes - a.premiacoes);

                    // Resumo Geral
                    this.resumo = {
                        totalSorteios: totalConcursos,
                        totalPalpites: palpitesParsed.length,
                        totalAcantosErros: totalErrosGerais,
                        taxaSucesso: totalComparacoes > 0 ? ((totalErrosGerais / totalComparacoes) * 100).toFixed(2) : 0
                    };

                    this.detalhado = detalhesTemp;
                    this.processado = true;

                    // Trigger Fireworks se 100% dos concursos tiveram premiação
                    if (totalConcursos > 0 && concursosComPremio === totalConcursos) {
                        this.$nextTick(() => {
                            this.dispararFireworks();
                        });
                    }
                }
            }
        }
    </script>
</body>
</html>
